<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자주 틀리는 맞춤법 완벽 마스터 (1~150제)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 10px; }
        header p { color: var(--text-sub); font-size: 0.95rem; }
        
        .card { background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 30px; margin-bottom: 20px; }
        
        .screen { display: none; }
        .screen.active { display: block; }

        .settings-group { margin-bottom: 20px; }
        .settings-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; background: #fff; }
        select:focus { border-color: var(--primary); }

        .btn { display: inline-block; width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; text-align: center; margin-top: 10px; }
        .btn:hover { background: var(--primary-hover); }
        .btn-secondary { background: #64748b; }
        .btn-secondary:hover { background: #475569; }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: 600; color: var(--text-sub); border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .question-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 25px; color: var(--text-main); }
        
        .options-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .option-item { padding: 16px 20px; background: #fff; border: 2px solid var(--border); border-radius: 10px; font-size: 1.1rem; text-align: left; cursor: pointer; transition: all 0.2s; font-weight: 500; display: flex; align-items: center; gap: 10px; }
        .option-item:hover:not(.disabled) { border-color: var(--primary); background: #f0fdf4; }
        .option-item.correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534; }
        .option-item.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }

        .explanation-box { background: #f1f5f9; border-left: 4px solid var(--primary); padding: 15px; border-radius: 0 8px 8px 0; margin-bottom: 20px; display: none; }
        .explanation-box.show { display: block; }

        .result-summary { text-align: center; margin-bottom: 30px; }
        .result-summary h2 { font-size: 2rem; color: var(--primary); margin-bottom: 10px; }
        .score-display { font-size: 3rem; font-weight: 800; color: #1e293b; margin-bottom: 15px; }
        
        .review-list { max-height: 400px; overflow-y: auto; margin-bottom: 20px; border: 1px solid var(--border); border-radius: 8px; padding: 15px; background: #f8fafc; text-align: left; }
        .review-item { padding: 12px; border-bottom: 1px solid var(--border); }
        .review-item:last-child { border-bottom: none; }
        .review-item .q-title { font-weight: 600; margin-bottom: 4px; }
        .review-item .ans-info { font-size: 0.9rem; color: var(--text-sub); }
        .review-item.is-wrong { color: #dc2626; }
        .review-item.is-correct { color: #16a34a; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>자주 틀리는 맞춤법 완벽 마스터 (1~150제)</h1>
        <p>프린트 원문 100% 완벽 반영 인터랙티브 퀴즈</p>
    </header>

    <!-- 설정 화면 -->
    <div id="setup-screen" class="card screen active">
        <div class="settings-group">
            <label for="range-select">풀이 범위 선택</label>
            <select id="range-select">
                <option value="all">전체 (1 ~ 150번)</option>
                <option value="1-50">1번 ~ 50번</option>
                <option value="51-100">51번 ~ 100번</option>
                <option value="101-150">101번 ~ 150번</option>
            </select>
        </div>

        <div class="settings-group">
            <label for="question-count">출제 문항 수</label>
            <select id="question-count">
                <option value="10">10문제</option>
                <option value="20">20문제</option>
                <option value="30">30문제</option>
                <option value="50">50문제</option>
                <option value="all">범위 내 전 문항</option>
            </select>
        </div>

        <div class="settings-group">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" id="shuffle-checkbox" checked style="width: 20px; height: 20px;">
                문제 무작위 섞기 (랜덤)
            </label>
        </div>

        <button class="btn" onclick="startQuiz()">퀴즈 시작하기</button>
    </div>

    <!-- 퀴즈 풀이 화면 -->
    <div id="quiz-screen" class="card screen">
        <div class="quiz-header">
            <span id="progress-indicator">문제 1 / 10</span>
            <span id="score-indicator">맞은 개수: 0</span>
        </div>
        
        <div class="question-text" id="question-title">문제가 여기에 표시됩니다.</div>
        
        <div class="options-container" id="options-container"></div>

        <div class="explanation-box" id="explanation-box">
            <strong>💡 해설:</strong> <span id="explanation-text">해설 내용</span>
        </div>

        <button class="btn" id="submit-btn" onclick="submitAnswer()">정답 제출 (Enter)</button>
        <button class="btn" id="next-btn" style="display: none;" onclick="nextQuestion()">다음 문제로 (Enter)</button>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="card screen">
        <div class="result-summary">
            <h2>퀴즈 완료! 🎉</h2>
            <div class="score-display" id="final-score-text">0 / 0</div>
            <p id="final-comment">수고하셨습니다!</p>
        </div>

        <h3 style="margin-bottom: 10px; font-size: 1.2rem;">📝 오답 노트 및 전체 결과</h3>
        <div class="review-list" id="review-list-container"></div>

        <button class="btn" onclick="restartQuiz()">처음으로 돌아가기</button>
        <button class="btn btn-secondary" id="retry-wrong-btn" onclick="retryWrongQuiz()" style="display: none;">틀린 문제만 다시 풀기</button>
    </div>
</div>

<script>
    const printData = [

        { id: 2, q: "이 옷이 더 (문안, 무난)하지?", options: ["문안", "무난"], answer: ["무난"], exp: "이렇다 할 어려움이 없다는 뜻은 '무난'입니다." },
        { id: 3, q: "오늘은 (반드시, 반듯이) 숙제 다 할 거야.", options: ["반드시", "반듯이"], answer: ["반드시"], exp: "틀림없이 꼭은 '반드시'입니다." },
        { id: 4, q: "왜 난리 (법석, 법썩)인지 모르겠네", options: ["법석", "법썩"], answer: ["법석"], exp: "'법석'이 표준어입니다." },
        { id: 5, q: "머리를 (싹둑, 싹뚝) 잘랐어.", options: ["싹둑", "싹뚝"], answer: ["싹둑"], exp: "'싹둑'이 바른 표기입니다." },
        { id: 6, q: "(언듯, 언뜻) 기억이 났어.", options: ["언듯", "언뜻"], answer: ["언뜻"], exp: "'언뜻'이 표준어입니다." },
        { id: 7, q: "(짭잘한, 짭짤한) 비빔밥", options: ["짭잘한", "짭짤한"], answer: ["짭짤한"], exp: "'짭짤하다'가 표준어입니다." },
        { id: 8, q: "김치를 (담갔다, 담궜다.)", options: ["담갔다", "담궜다"], answer: ["담갔다"], exp: "'담그다'의 활용형은 '담갔다'입니다." },
        { id: 9, q: "깍둑이, 깍두기, 깍투기 중에서 올바른 표준어를 모두 고르세요.", options: ["깍둑이", "깍두기", "깍투기"], answer: ["깍두기"], exp: "무를 납작하게 썰어 만든 반찬은 '깍두기'가 표준어입니다." },
        { id: 10, q: "물을 넣고 (졸여, 조려) 주세요.", options: ["졸여", "조려"], answer: ["졸여"], exp: "국물이 잦아들게 끓이는 것은 '조리다'입니다." },
        { id: 11, q: "직접 (달인, 다린) 대추차", options: ["달인", "다린"], answer: ["달인"], exp: "약재를 끓이는 것은 '달이다'입니다." },
        { id: 12, q: "오뚝이, 오뚜기", options: ["오뚝이", "오뚜기"], answer: ["오뚝이"], exp: "표준어 규정에 따라 '오뚜기'입니다." },
        { id: 13, q: "몇일, 몇 일, 며칠 중 올바른 표기는?", options: ["몇일", "몇 일", "며칠"], answer: ["며칠"], exp: "소리 나는 대로 '며칠'로 적습니다." },
        { id: 14, q: "내가 가도 (돼, 되)?", options: ["돼", "되"], answer: ["돼"], exp: "'되어'의 줄임말은 '돼'입니다." },
        { id: 15, q: "하면 (돼요, 되요).", options: ["돼요", "되요"], answer: ["돼요"], exp: "'돼요'가 올바른 표기입니다." },
        { id: 16, q: "내일 또 (봬요, 뵈요).", options: ["봬요", "뵈요"], answer: ["봬요"], exp: "'봬요'가 올바른 표기입니다." },

        { id: 23, q: "늦장 대응, 늑장 대응", options: ["늦장 대응", "늑장 대응"], answer: ["늦장 대응", "늑장 대응"], type: "multi", exp: "복수 표준어입니다." },

        { id: 29, q: "인사말, 인삿말", options: ["인사말", "인삿말"], answer: ["인사말"], exp: "'인사말'이 표준어입니다." },
        { id: 30, q: "존대말, 존댓말", options: ["존대말", "존댓말"], answer: ["존댓말"], exp: "'존댓말'이 표준어입니다." },
        { id: 31, q: "뒤풀이, 뒷풀이", options: ["뒤풀이", "뒷풀이"], answer: ["뒤풀이"], exp: "'뒤풀이'가 표준어입니다." },
        { id: 32, q: "오렌지빛, 오렌짓빛", options: ["오렌지빛","오렌짓빛"], answer: ["오렌지빛"], exp: "표준어 표기입니다." },
        { id: 33, q: "(에걔, 애걔) 고작 이거야?", options: ["에걔", "애걔"], answer: ["애걔"], exp: "뜻밖의 소리는 '애걔'입니다." },

        { id: 147, q: "내비게이션, 네비게이션", options: ["내비게이션", "네비게이션"], answer: ["내비게이션"], exp: "'내비게이션'이 표준어입니다." },
        { id: 148, q: "케익, 케이크", options: ["케익", "케이크"], answer: ["케이크"], exp: "'케이크'가 표준어입니다." },
        { id: 149, q: "스노쿨링, 스노클링", options: ["스노쿨링", "스노클링"], answer: ["스노클링"], exp: "'스노클링'이 표준어입니다." },
        { id: 150, q: "리더쉽, 리더십", options: ["리더쉽", "리더십"], answer: ["리더십"], exp: "'리더십'이 표준어입니다." }
    ];

    let currentQuizList = [];
    let currentIndex = 0;
    let score = 0;
    let userAnswers = [];

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startQuiz() {
        const rangeType = document.getElementById('range-select').value;
        const countType = document.getElementById('question-count').value;
        const isShuffle = document.getElementById('shuffle-checkbox').checked;

        let filtered = [];
        if (rangeType === 'all') {
            filtered = [...printData];
        } else if (rangeType === '1-50') {
            filtered = printData.filter(q => q.id >= 1 && q.id <= 50);
        } else if (rangeType === '51-100') {
            filtered = printData.filter(q => q.id >= 51 && q.id <= 100);
        } else if (rangeType === '101-150') {
            filtered = printData.filter(q => q.id >= 101 && q.id <= 150);
        }

        if (filtered.length === 0) {
            alert("선택한 범위에 문제가 없습니다.");
            return;
        }

        if (isShuffle) {
            filtered.sort(() => Math.random() - 0.5);
        }

        let limit = filtered.length;
        if (countType !== 'all') {
            limit = Math.min(parseInt(countType), filtered.length);
        }

        currentQuizList = filtered.slice(0, limit);
        currentIndex = 0;
        score = 0;
        userAnswers = [];

        switchScreen('quiz-screen');
        loadQuestion();
    }

    function loadQuestion() {
        const q = currentQuizList[currentIndex];
        document.getElementById('progress-indicator').innerText = `문제 ${currentIndex + 1} / ${currentQuizList.length}`;
        document.getElementById('score-indicator').innerText = `맞은 개수: ${score}`;
        document.getElementById('question-title').innerText = `${q.id}. ${q.q}`;

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        let currentOptions = [...q.options];
        const isMulti = q.type === 'multi' || q.answer.length > 1;
        if(document.getElementById('shuffle-checkbox').checked && q.options.length > 1 && !isMulti) {
            currentOptions.sort(() => Math.random() - 0.5);
        }

        currentOptions.forEach((opt, index) => {
            const label = document.createElement('label');
            label.className = 'option-item';
            
            const input = document.createElement('input');
            input.type = isMulti ? 'checkbox' : 'radio';
            input.name = 'quiz-option';
            input.value = opt;
            input.style.width = '18px';
            input.style.height = '18px';

            label.appendChild(input);
            label.appendChild(document.createTextNode(`(${index + 1}) ${opt}`));
            container.appendChild(label);
        });

        document.getElementById('explanation-box').classList.remove('show');
        document.getElementById('submit-btn').style.display = 'block';
        document.getElementById('next-btn').style.display = 'none';
    }

    function submitAnswer() {
        const q = currentQuizList[currentIndex];
        const selectedInputs = document.querySelectorAll('input[name="quiz-option"]:checked');
        
        if (selectedInputs.length === 0) {
            alert("정답을 선택해주세요!");
            return;
        }

        let selectedValues = Array.from(selectedInputs).map(input => input.value);
        
        let isCorrect = true;
        if (selectedValues.length !== q.answer.length) {
            isCorrect = false;
        } else {
            isCorrect = q.answer.every(ans => selectedValues.includes(ans));
        }

        if (isCorrect) score++;

        const optionItems = document.querySelectorAll('.option-item');
        optionItems.forEach(item => {
            const input = item.querySelector('input');
            input.disabled = true;
            item.classList.add('disabled');
            
            if (q.answer.includes(input.value)) {
                item.classList.add('correct');
            } else if (input.checked) {
                item.classList.add('wrong');
            }
        });

        userAnswers.push({
            questionObj: q,
            selected: selectedValues.join(', '),
            isCorrect: isCorrect
        });

        document.getElementById('score-indicator').innerText = `맞은 개수: ${score}`;
        document.getElementById('explanation-text').innerText = q.exp;
        document.getElementById('explanation-box').classList.add('show');
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'block';
        document.getElementById('next-btn').focus();
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuizList.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    document.addEventListener('keydown', function(event) {
        if (!document.getElementById('quiz-screen').classList.contains('active')) return;

        if (!isNaN(event.key) && event.key >= '1' && event.key <= '9') {
            const index = parseInt(event.key) - 1;
            const optionItems = document.querySelectorAll('.option-item');
            if (optionItems[index]) {
                const input = optionItems[index].querySelector('input');
                if (!input.disabled) {
                    if (input.type === 'radio') {
                        input.checked = true;
                    } else {
                        input.checked = !input.checked;
                    }
                }
            }
        }

        if (event.key === 'Enter') {
            event.preventDefault();
            const nextBtn = document.getElementById('next-btn');
            const submitBtn = document.getElementById('submit-btn');
            if (nextBtn && nextBtn.style.display !== 'none') {
                nextQuestion();
            } else if (submitBtn && submitBtn.style.display !== 'none') {
                submitAnswer();
            }
        }
    });

    function showResult() {
        switchScreen('result-screen');
        const total = currentQuizList.length;
        document.getElementById('final-score-text').innerText = `${score} / ${total}`;
        
        let comment = "완벽해요! 맞춤법 마스터시네요! 🌟";
        if (score / total < 0.6) comment = "조금 더 복습이 필요해요! 오답 노트를 확인해 보세요.";
        else if (score / total < 0.9) comment = "잘하셨어요! 조금만 더 하면 완벽합니다.";
        document.getElementById('final-comment').innerText = comment;

        const reviewContainer = document.getElementById('review-list-container');
        reviewContainer.innerHTML = '';

        let wrongCount = 0;
        userAnswers.forEach((item, idx) => {
            if (!item.isCorrect) wrongCount++;
            const div = document.createElement('div');
            div.className = `review-item ${item.isCorrect ? 'is-correct' : 'is-wrong'}`;
            div.innerHTML = `
                <div class="q-title">${idx + 1}. ${item.questionObj.q}</div>
                <div class="ans-info">내 답: ${item.selected} | 정답: <strong>${item.questionObj.answer.join(', ')}</strong></div>
                <div style="font-size:0.85rem; color:#475569; margin-top:4px;">해설: ${item.questionObj.exp}</div>
            `;
            reviewContainer.appendChild(div);
        });

        const retryBtn = document.getElementById('retry-wrong-btn');
        if (wrongCount > 0) {
            retryBtn.style.display = 'block';
            retryBtn.innerText = `틀린 문제만 다시 풀기 (${wrongCount}문제)`;
        } else {
            retryBtn.style.display = 'none';
        }
    }

    function restartQuiz() {
        switchScreen('setup-screen');
    }

    function retryWrongQuiz() {
        const wrongItems = userAnswers.filter(item => !item.isCorrect).map(item => item.questionObj);
        if (wrongItems.length === 0) return;

        currentQuizList = wrongItems;
        currentIndex = 0;
        score = 0;
        userAnswers = [];

        switchScreen('quiz-screen');
        loadQuestion();
    }
</script>

</body>
</html>
